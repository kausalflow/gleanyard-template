# Project settings; every key is optional. See https://kausalflow.github.io/gleanyard/
schema_version: 1
user_agent: "my-collection (+https://github.com/OWNER/my-collection)"   # say who you are; add a contact URL
excluded_hosts: []        # hosts research must not propose
dataherb:                 # list this project in a DataHerb catalog (https://dataherb.github.io); delete to turn off
  id: "my-collection"
  expected_interval: P1D  # how often collect runs; the catalog flags the data as stale after this
